<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>wht</title>

    <link rel="icon" type="image/jpg" href="favicon.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    background:black;
    color:white;
}

/* VIDEO FUNDO */

#bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-20;
    filter:brightness(1);
    display:none;
}

/* OVERLAY */

.background{
    position:fixed;
    inset:0;
    background:transparent;
    z-index:-10;
}

.background::after{
    content:'';
    position:absolute;
    inset:0;
    opacity:.03;
    background-image:radial-gradient(white 1px, transparent 1px);
    background-size:35px 35px;
}

/* ENTRADA */

.enter-screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(12px);
    background:rgba(0,0,0,.7);
    z-index:999;
    transition:1s;
}

.enter-box{
    padding:28px 60px;
    border-radius:20px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    font-size:22px;
    letter-spacing:2px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 40px rgba(255,255,255,.04);
}

.enter-box:hover{
    transform:scale(1.04);
    background:rgba(255,255,255,.08);
}

/* PERFIL */

.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    transition:1.2s;
}

.profile-card{

    width:420px;
    padding:42px;

    text-align:center;

    background:transparent;
    border:none;
    box-shadow:none;
}

/* FOTO */

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.12);
    box-shadow:0 0 40px rgba(255,255,255,.08);
    transition:.3s;
}


.views img{
    width:18px;
    opacity:.9;
}

.avatar-link{
    display:flex;
    justify-content:center;
    text-decoration:none;
}

.avatar-link:hover .avatar{
    transform:translateY(-4px) scale(1.03);
}

/* NOME */

h1{
    margin-top:20px;
    font-size:40px;
    font-weight:700;
    letter-spacing:1px;
}

/* BADGES */

.badges{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:10px;
}

.badges img{
    width:30px;
    height:30px;
    transition:.3s;
}

.badges img:hover{
    transform:scale(1.12);
}

/* BIO */

.bio{
    margin-top:18px;
    color:#aaa;
    line-height:1.7;
    font-size:15px;
}

/* REDES */

.socials{
    margin-top:24px;
    display:flex;
    justify-content:center;
    gap:16px;
}

.socials a{
    width:48px;
    height:48px;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    transition:.3s;
}

.socials a:hover{
    transform:translateY(-4px);
    background:white;
}

.socials img{
    width:22px;
}

/* MOBILE */

@media(max-width:500px){

    .profile-card{
        width:92%;
        padding:32px;
    }

    h1{
        font-size:34px;
    }

}

</style>
</head>

<body>

<video muted loop playsinline id="bg-video">
    <source src="background.mp4" type="video/mp4">
</video>

<div class="background"></div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<div class="enter-screen" id="enterScreen">

    <div class="enter-box" onclick="enterSite()">
        soul
    </div>

</div>

<div class="container" id="mainContent">

    <div class="profile-card">

        <a href="https://fakecrime.bio/w7" target="_blank" class="avatar-link">
            <img src="avatar.jpg" class="avatar">
        </a>

        <h1>wht</h1>

        <div class="badges">
            <img src="nitro.png">
            <img src="boost.png">
        </div>

        <p class="bio">
            life and made of moments that teach us.
        </p>

        <div class="socials">

            <a href="https://www.tiktok.com/@5109x" target="_blank">
                <img src="https://cdn.simpleicons.org/tiktok/white">
            </a>

            <a href="https://x.com/8024z" target="_blank">
                <img src="https://cdn.simpleicons.org/x/white">
            </a>

        </div>

    </div>

</div>

<script>

const enterScreen = document.getElementById("enterScreen");
const mainContent = document.getElementById("mainContent");
const music = document.getElementById("music");
const video = document.getElementById("bg-video");

function syncVideo(){

    if(Math.abs(video.currentTime - music.currentTime) > 0.15){
        video.currentTime = music.currentTime;
    }

}

function enterSite(){

    video.style.display = "block";

    music.volume = 0.5;

    Promise.all([
        music.play(),
        video.play()
    ]).then(()=>{

        video.currentTime = music.currentTime;

    });

    enterScreen.style.opacity = "0";
    enterScreen.style.pointerEvents = "none";

    mainContent.style.opacity = "1";

}

setInterval(syncVideo,100);

document.addEventListener("visibilitychange",()=>{

    if(!document.hidden){

        video.play();

        syncVideo();

    }

});

</script>

</body>
</html>
